<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blue Moon — floating in space</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #7d92b8; font: 13px/1.4 system-ui, sans-serif;
    user-select: none; pointer-events: none; opacity: .8;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">drag to rotate &middot; scroll to zoom</div>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// --- Interaction: dragging rotates the MOON, not the camera — the cosmos
// stays fixed in space. Scroll dollies the camera (same 2.2..9 range).
let camDist = 4.2;
let dragging = false, px = 0, py = 0;
let velY = 0, velX = 0;                    // drag inertia
renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; px = e.clientX; py = e.clientY;
});
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  velY = (e.clientX - px) * 0.005;
  velX = (e.clientY - py) * 0.005;
  moonGroup.rotation.y += velY;
  moonGroup.rotation.x = THREE.MathUtils.clamp(moonGroup.rotation.x + velX, -0.8, 0.8);
  px = e.clientX; py = e.clientY;
});
addEventListener('wheel', (e) => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.003, 2.2, 9);
});

// --- The moon: lit material + relief (normal & displacement maps derived from
// the photo), with a soft self-glow so the original luminous look survives
const moonGroup = new THREE.Group();
scene.add(moonGroup);

const loader = new THREE.TextureLoader();
function loadTex(url, srgb) {
  const t = loader.load(url);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const colorTex = loadTex('moon_eq.jpg?v=6', true);
const normalTex = loadTex('moon_normal.png?v=6');
const heightTex = loadTex('moon_height.png?v=6');
const aoTex = loadTex('moon_ao.png?v=6');

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1, 512, 512),
  new THREE.MeshStandardMaterial({
    map: colorTex,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(1.6, 1.6),
    displacementMap: heightTex,
    displacementScale: 0.03,
    roughness: 1.0,
    aoMap: aoTex,
    aoMapIntensity: 1.5,
    metalness: 0.0,
    emissive: 0xffffff,
    emissiveMap: colorTex,
    emissiveIntensity: 0.35
  })
);
moonGroup.add(moon);

// key light rides WITH the moon: relief shading stays locked to the surface,
// so the texture looks identical at any rotation angle
const sun = new THREE.DirectionalLight(0xe8f0ff, 0.55);
sun.position.set(2.5, 1.2, 2.0);
moonGroup.add(sun);
scene.add(new THREE.HemisphereLight(0x6a7fd0, 0x05070f, 0.45));

// --- Glow halo: bright inner ring + wide outer bloom (like the reference)
function makeGlowTexture(stops) {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  for (const [pos, col] of stops) grad.addColorStop(pos, col);
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const innerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture([
    [0.00, 'rgba(120,160,255,0)'],
    [0.78, 'rgba(120,160,255,0)'],
    [0.85, 'rgba(185,210,255,0.6)'],
    [0.92, 'rgba(100,140,255,0.2)'],
    [1.00, 'rgba(40,60,180,0)']
  ]),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true
}));
innerGlow.scale.setScalar(2.4);
moonGroup.add(innerGlow);
const outerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture([
    [0.00, 'rgba(120,160,255,0)'],
    [0.30, 'rgba(120,160,255,0.08)'],
    [0.40, 'rgba(150,185,255,0.3)'],
    [0.60, 'rgba(80,110,230,0.1)'],
    [1.00, 'rgba(40,60,180,0)']
  ]),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true
}));
outerGlow.scale.setScalar(5.2);
moonGroup.add(outerGlow);

// --- Starfield
const starCount = 2200;
const pos = new Float32Array(starCount * 3);
const col = new Float32Array(starCount * 3);
const phase = new Float32Array(starCount);
const speed = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  const v = new THREE.Vector3().randomDirection().multiplyScalar(30 + Math.random() * 25);
  pos.set([v.x, v.y, v.z], i * 3);
  const b = 0.35 + Math.random() * 0.65;
  const tint = Math.random();
  col.set([b * (0.8 + tint * 0.2), b * 0.9, b], i * 3);
  phase[i] = Math.random() * Math.PI * 2;
  speed[i] = 0.4 + Math.random() * 2.2;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
starGeo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
starGeo.setAttribute('speed', new THREE.BufferAttribute(speed, 1));
// custom shader: every star glimmers on its own phase/speed; positions are
// static — the cosmos twinkles but never moves
const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute float phase;
    attribute float speed;
    varying vec3 vColor;
    varying float vTw;
    uniform float uTime;
    void main() {
      vColor = color;
      float tw = 0.55 + 0.45 * sin(uTime * speed + phase);
      vTw = tw;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = (1.6 + 2.4 * tw) * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vTw;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor * (0.45 + vTw), a * (0.3 + 0.7 * vTw));
    }`
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// --- Animate: gentle float + slow self-rotation
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  moon.rotation.y = -Math.PI / 2 + t * 0.02;         // slow spin, near side first
  if (!dragging) {                                    // drag inertia, decaying
    moonGroup.rotation.y += velY;
    moonGroup.rotation.x = THREE.MathUtils.clamp(moonGroup.rotation.x + velX, -0.8, 0.8);
    velY *= 0.95; velX *= 0.95;
  }
  camera.position.z = camDist;
  starMat.uniforms.uTime.value = t;                   // starlight glimmer
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
